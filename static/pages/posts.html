<!-- Admin posts.html (Neumorphic) -->
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-logo" style="gap: 10px;">
      <img src="/static/assets/logo.jpg" alt="On Ice" style="height:32px; border-radius:4px; mix-blend-mode: multiply;">
      <span style="font-weight: 700; letter-spacing: 1px;">ON ICE</span>
    </div>
    <nav class="admin-nav">
      <div class="admin-nav-label">Overview</div>
      <a href="#/admin/dashboard" class="admin-nav-item"><span class="material-symbols-outlined">dashboard</span> Overview</a>
      <a href="#/admin/orders" class="admin-nav-item"><span class="material-symbols-outlined">receipt_long</span> Orders</a>
      <a href="#/admin/marketplace" class="admin-nav-item"><span class="material-symbols-outlined">storefront</span> Store</a>
      <div class="admin-nav-label">Content</div>
      <a href="#/admin/posts" class="admin-nav-item active"><span class="material-symbols-outlined">article</span> Posts</a>
      <a href="#/admin/techniques" class="admin-nav-item"><span class="material-symbols-outlined">school</span> Techniques</a>
      <a href="#/admin/gallery" class="admin-nav-item"><span class="material-symbols-outlined">photo_library</span> Gallery</a>
      <a href="#/admin/pages" class="admin-nav-item"><span class="material-symbols-outlined">description</span> Pages</a>
      <a href="#/admin/media" class="admin-nav-item"><span class="material-symbols-outlined">perm_media</span> Media</a>
      <div class="admin-nav-label">System</div>
      <a href="#/admin/messages" class="admin-nav-item"><span class="material-symbols-outlined">mail</span> Inbox</a>
      <a href="#/admin/users" class="admin-nav-item"><span class="material-symbols-outlined">group</span> Users</a>
      <a href="#/admin/settings" class="admin-nav-item"><span class="material-symbols-outlined">settings</span> Settings</a>
      
      <div style="margin-top:auto;">
        <a href="#/home" class="admin-nav-item"><span class="material-symbols-outlined">public</span> View Site</a>
        <a href="#/home" class="admin-nav-item" onclick="showToast('Logged out')"><span class="material-symbols-outlined">logout</span> Logout</a>
      </div>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <header class="admin-header">
      <div class="admin-search-bar">
        <span class="material-symbols-outlined">search</span>
        <input type="text" placeholder="Search..." onkeyup="if(window.filterAdmin) filterAdmin(this.value)">
      </div>
      
      <div class="admin-header-actions">
        <button class="admin-btn-icon" onclick="toggleTheme()" title="Toggle Dark Mode">
          <span class="material-symbols-outlined">contrast</span>
        </button>

        <button class="admin-btn-icon" onclick="showToast('No new notifications')">
          <span class="material-symbols-outlined">notifications</span>
        </button>
        <div class="admin-profile" onclick="navigateTo('admin/settings')">
          <img src="https://ui-avatars.com/api/?name=Admin+User&background=5a85ff&color=fff" alt="Admin">
          <span>My Overview</span>
          <span class="material-symbols-outlined" style="font-size:1rem; color:var(--admin-text-secondary);">expand_more</span>
        </div>
      </div>
    </header>

    <div style="margin-bottom:1.5rem;">
      <h1 style="font-size:1.8rem; font-weight:700; color:var(--admin-text-primary); text-transform:capitalize;">posts</h1>
    </div>

    
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
      
      <a href="#/admin/post-edit" class="soft-btn">+ New Post</a>
    </div>

    <div class="soft-panel ">
      <div style="display:flex; flex-direction:column; gap:1rem;" id="adminPostsList">
        <!-- Populated by script -->
      </div>
    </div>
  
  </main>
</div>

<!-- Try to keep any scripts the page originally had -->
<script>
(function() {
  const container = document.getElementById('adminPostsList');
  if (!window.POSTS || window.POSTS.length === 0) {
    container.innerHTML = `
      <div style="text-align:center; padding:4rem;">
        <h3 style="font-size:1.5rem; color:var(--text-secondary);">No Posts Yet</h3>
      </div>`;
    return;
  }
  
  container.innerHTML = window.POSTS.map(p => `
    <div style="display:flex; align-items:center; background:var(--bg-card); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); padding:1rem 1.5rem; box-shadow:var(--shadow-sm);">
      ${p.pinned ? '<span style="font-size:20px; margin-right:1rem;">📌</span>' : '<span style="width:20px; margin-right:1rem; display:inline-block;"></span>'}
      <div style="flex:1;">
        <div style="font-size:1.2rem; color:var(--text-primary); margin-bottom:0.25rem;">${p.title}</div>
        <div style="font-size:0.85rem; color:var(--text-secondary);">${p.date} · ⏱ ${p.readTime} min</div>
      </div>
      <div style="display:flex; gap:0.5rem; align-items:center;">
        <a href="#/admin/post-edit/${p.slug}" class="btn-secondary" style="padding:0.4rem 0.8rem; font-size:0.85rem;">✎ Edit</a>
        <a href="#/post/${p.slug}" class="btn-secondary" style="padding:0.4rem 0.8rem; font-size:0.85rem;" target="_blank">↗</a>
        <button class="btn-secondary" style="padding:0.4rem 0.8rem; font-size:0.85rem;" onclick="showToast('Pin toggled')">📌</button>
        <button class="btn-secondary" style="padding:0.4rem 0.8rem; font-size:0.85rem; border-color:var(--accent-error); color:var(--accent-error);" onclick="showToast('Post deleted')">✕</button>
      </div>
    </div>
  `).join('');
})();
</script>
