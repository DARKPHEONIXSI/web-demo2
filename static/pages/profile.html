<!-- Profile Page -->
<section class="section">
  <div class="container" style="max-width:900px;">
    <div class="profile-header reveal">
      <div class="profile-avatar">R</div>
      <div>
        <h1 style="font-family:var(--font-display); font-size:2rem;">Riya Sharma</h1>
        <p style="color:var(--text-muted); font-size:0.85rem;">riya.sharma@example.com · Member since 2025</p>
      </div>
    </div>

    <div class="glass-card reveal" style="margin-bottom:2rem;">
      <h2 style="font-family:var(--font-display); font-size:1.3rem; margin-bottom:1.5rem;">Order History</h2>
      <div id="orderHistory">
        <!-- Populated by script -->
      </div>
    </div>

    <div class="glass-card reveal" style="margin-bottom:2rem;">
      <h2 style="font-family:var(--font-display); font-size:1.3rem; margin-bottom:1.5rem;">Wishlist</h2>
      <div class="grid-3" style="gap:1rem;">
        ${PRODUCTS.slice(0, 3).map(p => `
          <div style="display:flex; gap:1rem; align-items:center; padding:1rem; border-radius:var(--radius-md); border:1px solid var(--border-subtle);">
            <img src="/static/${p.image}" style="width:50px; height:50px; border-radius:var(--radius-sm); object-fit:cover;">
            <div>
              <div style="font-size:0.85rem; font-weight:500;">${p.name}</div>
              <div style="font-size:0.8rem; color:var(--accent-ice);">₹${(p.sale_price||p.base_price).toLocaleString()}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="glass-card reveal">
      <h2 style="font-family:var(--font-display); font-size:1.3rem; margin-bottom:1.5rem;">Account Settings</h2>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Display Name</label>
          <input class="form-input" value="Riya Sharma">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" value="riya.sharma@example.com" type="email">
        </div>
      </div>
      <button class="btn-primary" onclick="showToast('Profile updated!')">Save Changes</button>
    </div>
  </div>
</section>

<script>
(function() {
  const statusBadge = (status) => {
    const map = { 'Delivered': 'badge-success', 'Shipped': 'badge-info', 'Processing': 'badge-warning', 'Cancelled': 'badge-error' };
    return `<span class="badge ${map[status] || 'badge-neutral'}">${status}</span>`;
  };

  document.getElementById('orderHistory').innerHTML = ORDERS.map(order => `
    <div style="display:flex; justify-content:space-between; align-items:center; padding:1.25rem; border-bottom:1px solid var(--border-subtle); flex-wrap:wrap; gap:1rem;">
      <div>
        <div style="font-weight:600; color:var(--text-primary); margin-bottom:0.25rem;">${order.id}</div>
        <div style="font-size:0.8rem; color:var(--text-muted);">
          ${new Date(order.date).toLocaleDateString('en-US', {year:'numeric',month:'short',day:'numeric'})}
          · ${order.items.length} item${order.items.length>1?'s':''} · ₹${order.total.toLocaleString()}
        </div>
      </div>
      <div style="display:flex; gap:0.75rem; align-items:center;">
        ${statusBadge(order.status)}
        <a href="#/order/${order.token}" class="btn-outline" style="font-size:0.75rem; padding:0.3rem 0.6rem;">Track</a>
        <a href="#/invoice/${order.token}" class="btn-outline" style="font-size:0.75rem; padding:0.3rem 0.6rem;">Invoice</a>
      </div>
    </div>
  `).join('');
})();
</script>
