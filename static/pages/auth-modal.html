<!-- Auth Modal Overlay -->
<div class="auth-overlay" id="auth-overlay">
  <div class="auth-modal" onclick="event.stopPropagation()">
    <button class="auth-close" onclick="closeAuthModal()">✕</button>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login" onclick="openAuthModal('login')">Sign In</button>
      <button class="auth-tab" data-tab="register" onclick="openAuthModal('register')">Create Account</button>
    </div>
    
    <div class="auth-form" id="loginForm">
      <h2 style="font-family:var(--font-display); font-size:1.5rem; margin-bottom:1.5rem; text-align:center;">Welcome Back</h2>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" placeholder="••••••••">
      </div>
      <button class="btn-primary" style="width:100%; margin-top:1rem; justify-content:center;" onclick="simulateAuth('login')">Sign In</button>
      
      <div style="display:flex; align-items:center; margin: 1.5rem 0;">
        <hr style="flex:1; border:none; border-top:1px solid var(--border-subtle);">
        <span style="padding:0 1rem; color:var(--text-muted); font-size:0.85rem;">OR</span>
        <hr style="flex:1; border:none; border-top:1px solid var(--border-subtle);">
      </div>
      
      <button class="btn-outline" style="width:100%; justify-content:center; display:flex; align-items:center; gap:0.75rem;" onclick="simulateAuth('google')">
        <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <div style="text-align:center; margin-top:1rem;">
        <a href="#" style="font-size:0.8rem; color:var(--text-muted); text-decoration:none;">Forgot password?</a>
      </div>
    </div>

    <div class="auth-form" id="registerForm" style="display:none;">
      <h2 style="font-family:var(--font-display); font-size:1.5rem; margin-bottom:1.5rem; text-align:center;">Join On Ice</h2>
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input class="form-input" type="text" placeholder="Jane Doe">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" placeholder="••••••••">
      </div>
      <button class="btn-primary" style="width:100%; margin-top:1rem; justify-content:center;" onclick="simulateAuth('register')">Create Account</button>
      
      <div style="display:flex; align-items:center; margin: 1.5rem 0;">
        <hr style="flex:1; border:none; border-top:1px solid var(--border-subtle);">
        <span style="padding:0 1rem; color:var(--text-muted); font-size:0.85rem;">OR</span>
        <hr style="flex:1; border:none; border-top:1px solid var(--border-subtle);">
      </div>
      
      <button class="btn-outline" style="width:100%; justify-content:center; display:flex; align-items:center; gap:0.75rem;" onclick="simulateAuth('google')">
        <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>
    </div>
  </div>
</div>

<script>
(function() {
  document.getElementById('auth-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeAuthModal();
  });

  window.simulateAuth = function(type) {
    // Secret admin login interceptor
    if (type === 'login') {
      const emailInput = document.querySelector('#loginForm input[type="email"]');
      if (emailInput && emailInput.value === 'admin@onice.com') {
        closeAuthModal();
        window.location.hash = '#/admin/dashboard';
        showToast('Welcome back, Administrator');
        return;
      }
    }

    showToast(type === 'login' ? 'Signed in successfully!' : 'Account created!');
    closeAuthModal();
    // Simulate updating UI to logged in state
    const authBtns = document.querySelectorAll('.nav-actions .btn-outline');
    authBtns.forEach(btn => {
      if(btn.textContent.includes('Sign In')) {
        btn.textContent = 'Profile';
        btn.onclick = () => navigateTo('profile');
      }
    });
  };
})();
</script>
