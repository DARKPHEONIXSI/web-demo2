# Project metadata
[project]
name = "onice"
version = "1.0.0"
description = "On Ice skating blog and e-commerce platform"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Coach", email = "coach@onice.com"}
]
keywords = ["flask", "skating", "e-commerce", "blog"]
dependencies = [
    "flask>=3.0",
    "python-dotenv>=1.0",
    "bleach>=6.0",
    "werkzeug>=3.0",
    "flask-wtf>=1.3",
    "flask-talisman>=1.1",
    "flask-limiter>=3.5",
    "gunicorn>=23.0",
    "razorpay>=2.0",
    "paytmchecksum>=1.7",
    "pycryptodome>=3.20",
    "pyjwt>=2.13",
    "sendgrid>=6.10",
    "twilio>=8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1",
    "black>=22.0",
    "mypy>=0.991",
    "pytest>=7.0",
]

[tool.ruff]
target-version = "py39"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise inside except handler
]

[tool.ruff.isort]
known-first-party = ["onice"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "./.venv/",
    "./.eggs/",
    "build/",
    "dist/",
    "__pycache__/",
]

[tool.pytest.ini_options]
testpaths = ["tests/"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
