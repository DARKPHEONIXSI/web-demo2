<section class="section page-enter oi-page">
  <div class="container oi-narrow" style="text-align:center; max-width: 600px; margin: 0 auto;">
    <div style="font-size: 3rem; margin-bottom: 1rem; color: var(--accent-aurora);">✅</div>
    <h1 class="section-title">Order Confirmed!</h1>
    <p style="color:var(--text-secondary); margin-bottom: 2.5rem;">
      Thank you for purchasing our coach-manufactured skates. Your order has been received and is being processed for shipping.
    </p>

    <div class="glass-card" style="margin-bottom: 3rem; text-align: left;">
      <p style="color:var(--text-secondary); font-size: 0.9rem; line-height: 1.8;">
        Order Number: <strong style="color:var(--text-primary);" id="success-order-id">#PENDING</strong><br>
        Total Paid: <strong style="color:var(--text-primary);" id="success-order-total">₹0.00</strong><br>
        Status: <strong style="color:var(--text-primary);">Processing</strong><br>
        <a href="#order-tracking" style="color:var(--accent-ice); text-decoration: underline; margin-top: 0.5rem; display: inline-block;">Track this order</a>
      </p>
    </div>

    <a href="#shop" style="display:inline-block; padding: 0.75rem 1.5rem; background: var(--accent-ice); color: var(--text-inverse); border-radius: var(--radius-sm); text-decoration: none; font-weight: 500;">
      Continue Shopping
    </a>
  </div>
</section>
<script>
  // Clear the cart on successful order
  localStorage.removeItem('cart');
  localStorage.removeItem('cartCount');
  if (window.updateCartBadge) window.updateCartBadge();
  
  // Fill order ID if mock data is available
  document.getElementById('success-order-id').textContent = '#' + Math.random().toString(36).substring(2, 10).toUpperCase();
  document.getElementById('success-order-total').textContent = '₹' + (Math.random() * 50000).toFixed(2);
</script>
