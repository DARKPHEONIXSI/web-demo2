<!-- Admin page-edit.html (Neumorphic) -->
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-logo" style="gap: 10px;">
      <img src="/static/assets/logo.jpg" alt="On Ice" style="height:32px; border-radius:4px; mix-blend-mode: multiply;">
      <span style="font-weight: 700; letter-spacing: 1px;">ON ICE</span>
    </div>
    <nav class="admin-nav">
      <div class="admin-nav-label">Overview</div>
      <a href="#/admin/dashboard" class="admin-nav-item"><span class="material-symbols-outlined">dashboard</span> Overview</a>
      <a href="#/admin/orders" class="admin-nav-item"><span class="material-symbols-outlined">receipt_long</span> Orders</a>
      <a href="#/admin/marketplace" class="admin-nav-item"><span class="material-symbols-outlined">storefront</span> Store</a>
      <div class="admin-nav-label">Content</div>
      <a href="#/admin/posts" class="admin-nav-item"><span class="material-symbols-outlined">article</span> Posts</a>
      <a href="#/admin/techniques" class="admin-nav-item"><span class="material-symbols-outlined">school</span> Techniques</a>
      <a href="#/admin/gallery" class="admin-nav-item"><span class="material-symbols-outlined">photo_library</span> Gallery</a>
      <a href="#/admin/pages" class="admin-nav-item active"><span class="material-symbols-outlined">description</span> Pages</a>
      <a href="#/admin/media" class="admin-nav-item"><span class="material-symbols-outlined">perm_media</span> Media</a>
      <div class="admin-nav-label">System</div>
      <a href="#/admin/messages" class="admin-nav-item"><span class="material-symbols-outlined">mail</span> Inbox</a>
      <a href="#/admin/users" class="admin-nav-item"><span class="material-symbols-outlined">group</span> Users</a>
      <a href="#/admin/settings" class="admin-nav-item"><span class="material-symbols-outlined">settings</span> Settings</a>
      
      <div style="margin-top:auto;">
        <a href="#/home" class="admin-nav-item"><span class="material-symbols-outlined">public</span> View Site</a>
        <a href="#/home" class="admin-nav-item" onclick="showToast('Logged out')"><span class="material-symbols-outlined">logout</span> Logout</a>
      </div>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <header class="admin-header">
      <div class="admin-search-bar">
        <span class="material-symbols-outlined">search</span>
        <input type="text" placeholder="Search..." onkeyup="if(window.filterAdmin) filterAdmin(this.value)">
      </div>
      
      <div class="admin-header-actions">
        <button class="admin-btn-icon" onclick="toggleTheme()" title="Toggle Dark Mode">
          <span class="material-symbols-outlined">contrast</span>
        </button>

        <button class="admin-btn-icon" onclick="showToast('No new notifications')">
          <span class="material-symbols-outlined">notifications</span>
        </button>
        <div class="admin-profile" onclick="navigateTo('admin/settings')">
          <img src="https://ui-avatars.com/api/?name=Admin+User&background=5a85ff&color=fff" alt="Admin">
          <span>My Overview</span>
          <span class="material-symbols-outlined" style="font-size:1rem; color:var(--admin-text-secondary);">expand_more</span>
        </div>
      </div>
    </header>

    <div style="margin-bottom:1.5rem;">
      <h1 style="font-size:1.8rem; font-weight:700; color:var(--admin-text-primary); text-transform:capitalize;">page edit</h1>
    </div>

    
    <div style="max-width:800px; margin:0 auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
        
        <a href="#/admin/pages" class="soft-btn-outline">← Pages</a>
      </div>
      
      <div class="soft-panel ">
        <div class="form-group">
          <label class="form-label">Page Name *</label>
          <input class="form-input" id="pgName" placeholder="e.g. About">
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-bottom:1.5rem;">
          <div class="form-group" style="margin:0;">
            <label class="form-label">SEO Title</label>
            <input class="form-input" id="pgSeoTitle">
          </div>
          <div class="form-group" style="margin:0;">
            <label class="form-label">SEO Description</label>
            <input class="form-input" id="pgSeoDesc">
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Body</label>
          <div style="border:1px solid var(--border-subtle); border-radius:var(--radius-lg); background:var(--bg-surface); overflow:hidden;">
            <div style="display:flex; gap:0.25rem; padding:0.5rem; border-bottom:1px solid var(--border-subtle); background:var(--bg-deep);">
              <button class="soft-btn-outline" style="padding:0.3rem 0.6rem; font-size:12px; border:none;" onclick="document.execCommand('bold',false,null)"><b>B</b></button>
              <button class="soft-btn-outline" style="padding:0.3rem 0.6rem; font-size:12px; border:none;" onclick="document.execCommand('italic',false,null)"><i>I</i></button>
              <button class="soft-btn-outline" style="padding:0.3rem 0.6rem; font-size:12px; border:none;" onclick="document.execCommand('formatBlock',false,'<h2>')">H2</button>
              <button class="soft-btn-outline" style="padding:0.3rem 0.6rem; font-size:12px; border:none;" onclick="document.execCommand('formatBlock',false,'<h3>')">H3</button>
              <button class="soft-btn-outline" style="padding:0.3rem 0.6rem; font-size:12px; border:none;" onclick="document.execCommand('insertUnorderedList',false,null)">• List</button>
            </div>
            <div id="pgBody" contenteditable="true" style="padding:1.5rem; min-height:300px; outline:none; line-height:1.6;"></div>
          </div>
        </div>
        
        <div style="display:flex; gap:1rem; margin-top:2rem;">
          <button class="soft-btn" onclick="showToast('Page saved')">💾 Save Page</button>
          <button class="soft-btn-outline" style="border-color:var(--accent-error); color:var(--accent-error);" onclick="showToast('Page deleted')">✕ Delete</button>
        </div>
      </div>
    </div>
  
  </main>
</div>

<!-- Try to keep any scripts the page originally had -->
<script>
(function() {
  const param = window.__routeParam;
  if (param) {
    document.getElementById('pgTitle').textContent = 'Edit Page';
    document.getElementById('pgName').value = param.charAt(0).toUpperCase() + param.slice(1);
    document.getElementById('pgBody').innerHTML = "<p>Existing content for " + param + "...</p>";
  }
})();
</script>
