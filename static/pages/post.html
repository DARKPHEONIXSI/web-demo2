<!-- Blog Post Detail Page -->
<section class="section">
  <div class="container" id="postContainer">
    <!-- Populated by script -->
  </div>
</section>

<script>
(function() {
  const slug = window.__routeParam;
  const post = POSTS.find(p => p.slug === slug || p.id === parseInt(slug)) || POSTS[0];
  
  document.getElementById('postContainer').innerHTML = `
    <div style="margin-bottom:1.5rem;">
      <a href="#/home" class="btn-ghost" style="padding:0;">← Back to Journal</a>
    </div>
    
    <div class="post-hero reveal">
      <img src="/static/${post.cover_image}" alt="${post.title}">
      <div class="post-hero-overlay">
        <div>
          <span class="badge badge-info" style="margin-bottom:0.75rem;">${post.category}</span>
          <h1 style="font-family:var(--font-display); font-size:clamp(1.8rem,4vw,3rem); color:white; margin-bottom:0.5rem;">${post.title}</h1>
          <div style="display:flex; gap:1rem; align-items:center; color:rgba(255,255,255,0.7); font-size:0.85rem;">
            <div class="article-card-avatar" style="width:28px; height:28px; font-size:0.7rem;">${post.author[0]}</div>
            <span>${post.author}</span>
            <span>·</span>
            <span>${new Date(post.post_date).toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'})}</span>
            <span>·</span>
            <span>${post.read_time} min read</span>
          </div>
        </div>
      </div>
    </div>

    <article class="post-content reveal">
      ${post.content}
      
      <div style="margin-top:3rem; padding-top:2rem; border-top:1px solid var(--border-subtle);">
        <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1rem;">
          ${post.tags.map(t => `<span class="badge badge-neutral">#${t}</span>`).join(' ')}
        </div>
      </div>
    </article>

    <!-- Related Posts -->
    <div class="reveal" style="margin-top:2rem;">
      <h2 style="font-family:var(--font-display); font-size:1.5rem; margin-bottom:1.5rem;">More from the Journal</h2>
      <div class="grid-3" id="relatedPosts"></div>
    </div>
  `;

  // Related posts
  const related = POSTS.filter(p => p.id !== post.id).slice(0, 3);
  document.getElementById('relatedPosts').innerHTML = related.map(p => `
    <article class="article-card shimmer">
      <a href="#/post/${p.slug}" style="text-decoration:none; color:inherit; display:contents;">
        <div class="article-card-img-wrap">
          <img src="/static/${p.cover_image}" class="article-card-img" alt="${p.title}">
          <div class="article-card-tag">${p.category}</div>
        </div>
        <div class="article-card-body">
          <h3 class="article-card-title">${p.title}</h3>
          <p class="article-card-excerpt">${p.excerpt}</p>
        </div>
      </a>
    </article>
  `).join('');
})();
</script>
