<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Admin — {{ settings.get('blog_name', 'On Ice') }}</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/glacial.css') }}?v=2.2">
</head>
<body class="oi-auth-shell">

  <div class="oi-auth-card">
    <div style="text-align: center;">
      <div style="margin-bottom: 2rem;">
        <span class="material-symbols-outlined" style="font-size: 40px; color: var(--primary); margin-bottom: 0.5rem;">admin_panel_settings</span>
        <div class="section-label">Coach Panel</div>
        <div class="display-lg" style="font-size: 28px;">Admin Access</div>
      </div>

      {% if login_err %}
      <div class="alert" style="background:var(--error); color:white; padding:0.75rem; border-radius:var(--radius); margin-bottom:1.5rem; font-size:14px;">
        {{ login_err }}
      </div>
      {% endif %}

      <form method="post" style="text-align: left;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-input" name="username" placeholder="admin" autocomplete="username" autofocus required>
        </div>
        
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        
        <button type="submit" class="gp-btn-primary" style="width:100%; justify-content:center; margin-top:1rem; padding:0.875rem;">Enter Dashboard</button>
      </form>
      
      <div style="margin-top:2rem;">
        <a href="{{ url_for('home') }}" style="font-size:13px; color:var(--on-surface-variant); text-decoration:none; font-weight:500;">← Back to Blog</a>
      </div>
    </div>
  </div>

</body>
</html>
